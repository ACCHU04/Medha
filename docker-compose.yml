services:
  db:
    image: postgres:16-alpine
    container_name: medha-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medha_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-medha_link}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - medha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medha} -d ${POSTGRES_DB:-medha_link}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medha_pgdata:
